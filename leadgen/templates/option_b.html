<!-- leadgen/templates/landing_option_b.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Lead Capture</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    {% include "navbar.html" %}

    <div class="lead-container">

        <h1>Request a Cleaning Products Order Quote</h1>

        <form action="/submit-lead" method="post" class="lead-form">

            <input name="name" placeholder="Your Name" required>

            <input name="email" placeholder="Email" required>

            <input name="phone" placeholder="Phone" required>

            <input name="business_type" placeholder="Business Type">

            <input name="service_needed" placeholder="Service Needed">

            <button type="submit">Submit</button>
        </form>

    </div>

    <div class="service-cta">
        <p>Need Commercial Cleaning Services Instead?</p>

        <a href="/contact" class="service-button">
            Request Commercial Cleaning Services
        </a>
    </div>
</body>
</html>
